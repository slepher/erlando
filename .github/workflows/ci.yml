name: master

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to run the integration job against
        required: true
        type: string

permissions:
  contents: read

jobs:
  integration:
    name: Integration / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    container: erlang:${{ matrix.otp }}
    env:
      ERLANDO_DEPENDENCY_MODE: master
    strategy:
      fail-fast: false
      matrix:
        otp: ['29', '28', '27', '26', '25', '24', '23', '22', '21']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify cold checkout (no cache or tracked lock)
        run: |
          set -eu
          # actions/checkout gives each job a fresh workspace; this workflow
          # has no cache and rebar.lock is not tracked, so resolution is cold.
          if [ -e _checkouts ]; then
            echo '_checkouts must not exist in a cold CI workspace' >&2
            exit 1
          fi

      - name: Dependency tree
        run: rebar3 tree -v

      - name: Compile
        run: rebar3 compile

      - name: Common Test
        run: rebar3 as test clean -a && rebar3 ct
